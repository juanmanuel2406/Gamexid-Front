# The Angular entry document must always be revalidated so clients discover
# the current hashed JavaScript and CSS bundles after each Gamexid release.
location = / {
    add_header Cache-Control "no-store, max-age=0" always;
    add_header Pragma "no-cache" always;
    try_files /index.html =404;
}

location = /index.html {
    add_header Cache-Control "no-store, max-age=0" always;
    add_header Pragma "no-cache" always;
    try_files $uri =404;
}
