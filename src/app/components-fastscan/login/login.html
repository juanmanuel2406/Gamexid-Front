<div class="login-wrap">
  <div class="login-row">
    <!-- PANEL BRAND -->
    <div class="login-brand">
      <svg class="brand-logo gamexid-logo" viewBox="190 95 365 345" role="img" aria-label="Gamexid"><image href="/gamexid-logo.png" width="744" height="596"/></svg>
      <h1 class="visually-hidden">Gamexid</h1>
      <p class="brand-lema">{{ lema }}</p>
      <div class="brand-tags">
        <span class="tag"><i class="bi bi-box-seam"></i> Inventario</span>
        <span class="tag"><i class="bi bi-upc"></i> Control EAN</span>
        <span class="tag"><i class="bi bi-arrow-down-left-circle"></i> Ingresos</span>
      </div>
    </div>

    <!-- FORM -->
    <div class="login-card card-fastscan">
      <h2 class="login-title">Iniciar sesión</h2>
      <p class="login-sub">Ingresá con tu cuenta para continuar</p>

      <div class="form-group mb-3">
        <label class="form-label" for="login-email">Email</label>
        <div class="input-icono">
          <i class="bi bi-envelope"></i>
          <input id="login-email" type="email" class="form-control" [(ngModel)]="email" required
                 placeholder="usuario@gamexid.com" autocomplete="email" inputmode="email" [attr.aria-invalid]="errorMsg ? 'true' : null">
        </div>
      </div>

      <div class="form-group mb-3">
        <label class="form-label" for="login-password">Contraseña</label>
        <div class="input-icono">
          <i class="bi bi-shield-lock"></i>
          <input id="login-password" [type]="mostrarPassword ? 'text' : 'password'" class="form-control"
                 [(ngModel)]="password" placeholder="••••••••" autocomplete="current-password" minlength="8" required (keyup.enter)="ingresar()" [attr.aria-invalid]="errorMsg ? 'true' : null">
          <button type="button" class="btn-ojo" (click)="togglePassword()" [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <i class="bi" [ngClass]="mostrarPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
      </div>

      <div class="alert alert-danger py-2" *ngIf="errorMsg">
        <i class="bi bi-exclamation-triangle"></i> {{ errorMsg }}
      </div>

      <button class="btn-login" (click)="ingresar()" [disabled]="cargando">
        <span *ngIf="!cargando"><i class="bi bi-box-arrow-in-right"></i> Ingresar</span>
        <span *ngIf="cargando" class="spinner-border spinner-border-sm"></span>
      </button>

      <div class="login-nota">
        <i class="bi bi-info-circle"></i>
        Acceso autorizado para Gamexid. Ingresá el correo y la contraseña de tu cuenta.
      </div>
    </div>
  </div>
</div>
