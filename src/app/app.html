<ng-container *ngIf="!esLogin; else loginView">
<div class="shell" [ngClass]="{ 'menu-cerrado': !menuAbierto }">
  <div class="ambient ambient-uno"></div>
  <div class="ambient ambient-dos"></div>
  <!-- SIDEBAR -->
  <aside class="sidebar" (mouseenter)="abrirMenuHover()" (mouseleave)="cerrarMenuHover()" (focusin)="abrirMenuHover()" (focusout)="salirFocoMenu($event)">
    <div class="sidebar-logo">
      <svg class="logo-badge gamexid-mark" viewBox="215 105 315 245" role="img" aria-label="Logo Gamexid"><image href="/gamexid-logo.png" width="744" height="596"/></svg>
      <div class="logo-texto" *ngIf="menuAbierto">
        <span class="logo-nombre">Gamexid</span>
        <span class="logo-lema">{{ lema }}</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a class="sidebar-item" [class.activo]="esActivo('dashboard')" (click)="ir('dashboard')">
        <i class="bi bi-grid-1x2"></i><span *ngIf="menuAbierto">{{ textos.dashboard }}</span>
      </a>
      <a class="sidebar-item" [class.activo]="esActivo('productos')" (click)="ir('productos')">
        <i class="bi bi-box-seam"></i><span *ngIf="menuAbierto">{{ textos.products }}</span>
      </a>
      <a class="sidebar-item" [class.activo]="esActivo('sucursales')" (click)="ir('sucursales')">
        <i class="bi bi-building"></i><span *ngIf="menuAbierto">{{ textos.branches }}</span>
      </a>
      <a class="sidebar-item" [class.activo]="esActivo('ingresos')" (click)="ir('ingresos')">
        <i class="bi bi-arrow-down-left-circle"></i><span *ngIf="menuAbierto">{{ textos.entries }}</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="usuario-chip" *ngIf="menuAbierto">
        <div class="avatar">{{ inicial }}</div>
        <div class="usuario-datos">
          <span class="usuario-nombre">{{ usuario }}</span>
          <span class="usuario-rol">{{ rol }}</span>
        </div>
      </div>
      <button class="btn-cerrar" (click)="cerrarSesion()">
        <i class="bi bi-box-arrow-left"></i><span *ngIf="menuAbierto">Salir</span>
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <header class="topbar">
      <button class="btn-toggle" (click)="toggleMenu()" aria-label="Abrir o cerrar el menú">
        <i class="bi" [ngClass]="menuAbierto ? 'bi-layout-sidebar-inset' : 'bi-layout-sidebar-inset-reverse'"></i>
      </button>
      <div class="topbar-titulo">
        <span class="titulo-pagina">{{ paginaActual }}</span>
      </div>
      <div class="topbar-acciones">
        <span class="badge-version"><span class="status-dot"></span> {{ textos.online }}</span>
        <a class="btn-nuevo" [routerLink]="['/ingresos']">
          <i class="bi bi-plus-lg"></i> {{ textos.newEntry }}
        </a>
      </div>
    </header>

    <main class="contenido" (scroll)="onContenidoScroll($event)">
      <router-outlet></router-outlet>
    </main>
    <button class="volver-arriba" *ngIf="mostrarVolverArriba" (click)="volverArriba()" aria-label="Volver arriba">
      <i class="bi bi-arrow-up"></i>
    </button>
  </div>
</div>
</ng-container>
<ng-template #loginView><router-outlet></router-outlet></ng-template>
