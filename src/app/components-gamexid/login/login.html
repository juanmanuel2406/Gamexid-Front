<div class="curtain" aria-hidden="true">
  <div class="half top"></div>
  <div class="half bot"></div>
  <div class="seam"><i></i></div>
</div>
<a class="back" routerLink="/"><gx-icon name="back" [size]="16" />Volver al inicio</a>
<main class="login-wrap">
  <section class="brand-panel">
    <div class="gx-lockup gamexid-logo" data-in>
      <gx-isotype [animated]="true" [loop]="true" label="Gamexid" />
      <span class="gx-word"><b>GAMEXID</b><small>SERIAL TRACKING</small></span>
    </div>
    <p class="eyebrow" data-in>Inventario serializado · red de sedes</p>
    <h1 data-in>Cada consola, cada serial, en la sede correcta.</h1>

  </section>
  <section class="access-panel">
    <form class="login-card" (ngSubmit)="ingresar()" novalidate>
      <h2>Iniciar sesión</h2>

      <label class="form-group" for="login-email"
        ><span class="form-label">Email</span>
        <div class="input-icon">
          <gx-icon name="mail" /><input
            id="login-email"
            name="email"
            type="email"
            class="form-control"
            [(ngModel)]="email"
            autocomplete="username"
            placeholder="nombre@gamexid.com"
            required
          /></div
      ></label>
      <label class="form-group" for="login-password"
        ><span class="form-label">Contraseña</span>
        <div class="input-icon">
          <gx-icon name="lock" /><input
            id="login-password"
            name="password"
            [type]="visible() ? 'text' : 'password'"
            class="form-control"
            [(ngModel)]="password"
            autocomplete="current-password"
            required
          /><button
            type="button"
            class="password-toggle"
            (click)="visible.set(!visible())"
            [attr.aria-label]="visible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            <gx-icon [name]="visible() ? 'hidden' : 'eye'" />
          </button></div
      ></label>
      @if (error()) {
        <p class="notice status-error" role="alert"><gx-icon name="alert" />{{ error() }}</p>
      }
      <button type="submit" class="btn-login" [disabled]="busy()">
        @if (granted()) {
          <gx-icon name="check" /> Acceso concedido
        } @else if (busy()) {
          <span class="spinner" aria-hidden="true"></span> Validando credenciales
        } @else {
          Entrar al workspace <gx-icon name="arrow" />
        }
      </button>
      <div class="access-foot">
        <gx-icon name="shield" />
        <p>Sesión con cookie segura de 8 horas. Usá únicamente una cuenta autorizada.</p>
      </div>
    </form>
  </section>
</main>
