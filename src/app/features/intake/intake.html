<div
  class="dropzone"
  [class.dragging]="dragging()"
  [attr.aria-busy]="busy()"
  (dragover)="$event.preventDefault(); dragging.set(true)"
  (dragleave)="dragging.set(false)"
  (drop)="onDrop($event)"
>
  <div #laser class="scan-laser" [class.active]="busy()"></div>
  <gx-icon name="upload" [size]="26" /><strong>Arrastrá el remito o pedido</strong>
  <p>PDF · Hasta 10 MB · Máximo 50 páginas</p>
  <label class="btn-secundario" for="pedido-pdf">Seleccionar archivo</label
  ><input
    id="pedido-pdf"
    type="file"
    accept=".pdf,application/pdf"
    class="sr-only"
    [disabled]="busy()"
    (change)="onInput($event)"
  />
</div>
@if (message()) {
  <p class="notice" role="status"><gx-icon name="file" />{{ message() }}</p>
}
@if (file()) {
  <div class="intake-toolbar">
    <span class="code-pill">{{ file()?.name }}</span
    ><button
      class="btn-primario"
      (click)="extract(laser)"
      [disabled]="!workspace.pdfPig() || busy()"
    >
      <gx-icon name="file" />{{ busy() ? 'Procesando…' : 'Extraer con PdfPig' }}
    </button>
  </div>
  @if (!workspace.pdfPig()) {
    <p class="muted text-xs mb-4">La extracción de PDF no está disponible. Revisá la conexión con la API.</p>
  }
  <div class="document-split">
    <section class="document-pane">
      <div class="pane-header">
        <span>01 / DOCUMENTO ORIGINAL</span
        ><select aria-label="Página del PDF" [ngModel]="page()" (ngModelChange)="render(+$event)">
          @for (n of [].constructor(pageCount()); track $index) {
            <option [value]="$index + 1">Página {{ $index + 1 }}</option>
          }
        </select>
      </div>
      @if (preview()) {
        <img [src]="preview()" alt="Vista previa de la página del remito" class="pdf-preview" />
      } @else {
        <p-skeleton height="300px" />
      }
    </section>

  </div>
}
